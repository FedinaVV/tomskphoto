<section class="portfolio" id="portfolio">
  <div class="section-inner">
    <h2 class="section-title">Портфолио фотографа в Томске</h2>
    <div class="portfolio__grid">
      @for (item of items; track item.url) {
        <div class="p-item" [class.p-item--wide]="item.wide">
          <img [src]="item.url" [alt]="item.alt" loading="lazy" decoding="async" />
        </div>
      }
    </div>
  </div>
</section>
